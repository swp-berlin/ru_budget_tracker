name: Build & Push Docker Images

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app:      ${{ steps.filter.outputs.app }}
      importer: ${{ steps.filter.outputs.importer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - "./**"
              - "!./importer/**"
            importer:
              - "./importer/**"

  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/app:${{ substr(github.sha, 0, 7) }}
            ghcr.io/${{ github.repository }}/app:latest

  build-importer:
    needs: changes
    if: needs.changes.outputs.importer == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./importer
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/importer:${{ github.sha:7 }}
            ghcr.io/${{ github.repository }}/importer:latest
